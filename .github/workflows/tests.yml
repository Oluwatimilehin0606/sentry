# Runs every check on each push and pull request: lint, types, the API and website tests, and the
# browser test that walks the whole journey in Chrome. The badge at the top of the README shows the
# latest result, so anyone can see that Sentry's tests pass.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sentry
          POSTGRES_PASSWORD: sentry-ci-only
          POSTGRES_DB: sentry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway database that exists only for this run; not a secret.
      DATABASE_URL: postgres://sentry:sentry-ci-only@localhost:5432/sentry_test
      # Used as is by the API and browser tests (otherwise they'd add "_test" to the name).
      TEST_DATABASE_URL: postgres://sentry:sentry-ci-only@localhost:5432/sentry_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: API and website tests
        run: npm test

      - name: Browser test (the whole journey in Chrome)
        run: npm run test:e2e
