# Sentry online, on Render's free plan: one web service (the website and API together).
# Render reads this file when you create a "Blueprint" from the repository; see README
# "Putting Sentry online". Values marked `sync: false` are asked for once and never stored here.
services:
  - type: web
    name: sentry
    runtime: node
    plan: free
    # The closest Render region to Nigeria.
    region: frankfurt
    buildCommand: npm ci && npm run build
    # Brings the database up to date, then starts Sentry on the port Render gives it.
    startCommand: npm start
    # No healthCheckPath: on the free plan Render's health checks never reached new instances
    # (2026-10-03), so every deploy timed out. Without it Render goes live once the port opens.
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The port Render's health check and proxy use. Set explicitly: without it Sentry falls back
      # to APP_URL's port (80), and a deploy once waited for a health check on 10000 until it failed.
      - key: PORT
        value: "10000"
      # Three proxies sit in front of Sentry on Render (measured 2026-10-03): Cloudflare (Render's
      # edge), Render's load balancer, and a relay on the machine itself. See TRUST_PROXY in
      # server/src/env.ts.
      - key: TRUST_PROXY
        value: "3"
      - key: APP_TIMEZONE
        value: Africa/Lagos
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # e.g. https://sentry.yourdomain.com.ng
      - key: APP_URL
        sync: false
      # Neon's connection string (Postgres).
      - key: DATABASE_URL
        sync: false
      # Resend on port 2465 (Render's free plan blocks the usual email ports):
      # smtps://resend:<API key>@smtp.resend.com:2465
      - key: SMTP_URL
        sync: false
      # e.g. Sentry <alerts@yourdomain.com.ng>
      - key: MAIL_FROM
        sync: false
      # The deliberately weak demo website, e.g. demo.yourdomain.com.ng
      - key: DEMO_SITE_HOST
        sync: false
