<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sentry checks your business website's security and explains what it finds in plain English: one grade, what each problem means, and what to fix first. Free."
    />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b111c" media="(prefers-color-scheme: dark)" />

    <!-- Link previews (WhatsApp, LinkedIn, Slack, X). og:image and og:url are added at deployment,
         since they need the site's public address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sentry" />
    <meta property="og:title" content="Sentry: is your business website leaving the door open?" />
    <meta
      property="og:description"
      content="A free security check-up for small businesses, explained in plain English. One grade, and a clear list of what to fix first."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable app: name, icons and colours (see public/manifest.webmanifest and sw.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Sentry" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Applies the saved theme before first paint (see the file for why it isn't inline). -->
    <script src="/theme-init.js"></script>
    <title>Sentry: plain-English security check-ups for small businesses</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
